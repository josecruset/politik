name: Test and deploy to staging
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: politik-staging
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test calculations and parsing
        run: npm test
      - name: Prepare application archive
        run: tar -czf /tmp/politik-release.tar.gz Dockerfile .dockerignore package.json src public
      - name: Configure deployment SSH key
        env:
          DEPLOY_KEY: ${{ secrets.STAGING_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/politik
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/politik ~/.ssh/known_hosts
      - name: Deploy exact pushed revision
        env:
          REVISION: ${{ github.sha }}
        run: |
          ssh -T -i ~/.ssh/politik -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes root@207.180.217.99 "deploy $REVISION" < /tmp/politik-release.tar.gz
      - name: Verify public HTTPS and deployed revision
        env:
          REVISION: ${{ github.sha }}
        run: |
          curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors --max-time 20 https://politik.cruset.com/healthz > /tmp/health.json
          node --input-type=module -e 'import fs from "node:fs"; const h=JSON.parse(fs.readFileSync("/tmp/health.json")); if(h.version!==process.env.REVISION || !h.dataReady) process.exit(1); console.log(h);'
      - name: Remove deployment key
        if: always()
        run: rm -f ~/.ssh/politik
